name: Build TARTAY 2D APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip Android project
        run: |
          INNER_ZIP="./Tartay2D_Android.zip"

          if [ ! -f "$INNER_ZIP" ]; then
            echo "ERROR: Tartay2D_Android.zip not found in repository root"
            exit 1
          fi

          rm -rf android-project
          mkdir -p android-project
          unzip -o "$INNER_ZIP" -d android-project

          echo "Extracted project:"
          find android-project -maxdepth 8 -type f | sort

      - name: Build APK
        run: |
          BUILD_FILE=$(find android-project -name build.gradle -type f | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found"
            find android-project -maxdepth 8 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Android project: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          find android-project -name "*.apk" -type f -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TARTAY-2D-APK
          path: android-project/**/*.apk
          if-no-files-found: error
